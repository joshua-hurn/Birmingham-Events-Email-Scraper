name: Update Birmingham Proton Calendar Feed

on:
  schedule:
    # Runs every Thursday at 13:00 UTC (8:00 AM Central)
    - cron: "0 13 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Birmingham Event Curator (Generate Proton Calendar .ics)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKAHEAD_DAYS: "30"
        run: python main.py --no-email

      - name: Commit updated birmingham_events.ics for Proton Calendar URL subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/birmingham_events.ics data/interests.json
          git diff --staged --quiet || git commit -m "chore: update Birmingham Proton Calendar feed"
          git push
